name: Supply chain

# S4-20：主干 ci.yml 只有编译/单测/lint，没有供应链门禁。
# 本工作流补齐四件免费的安全能力，并保持所有第三方 action 固定到 commit SHA
# （浮动 tag 可被移动到恶意 commit，而 release.yml 手里握着签名私钥）。
#   - CodeQL：Kotlin/Java/Go SAST
#   - govulncheck：Go 依赖（含 gomobile 打进 AAR 的那条链）已知 CVE
#   - dependency-review：PR 依赖 diff 审计（新增 GPL/可疑包直接 fail）
#   - trivy + syft：仓库/依赖漏洞扫描与 CycloneDX SBOM
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * 1" # 每周一 UTC 18:00 全量重扫，发现新披露 CVE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (kotlin/java/go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: kotlin, java, go
      - name: Build Kotlin (CodeQL needs a build for Java/Kotlin)
        run: ./gradlew --no-daemon :app:compileDebugKotlin -PtvboxSkipPlatformBind=true
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3

  go-vuln:
    name: govulncheck (Go dependency chain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go modules
        working-directory: platform_live_go
        run: govulncheck ./...

  dependency-review:
    name: Dependency diff review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # 新增 GPL/AGPL/SSPL 等强 copyleft 依赖直接阻断；与 S2-08 的 OSS 清单口径一致。
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  trivy-sbom:
    name: Trivy filesystem scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .git,.gradle,.kotlin,build,app/build
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
      - name: Generate CycloneDX SBOM
        run: |
          "$RUNNER_TEMP/bin/syft" dir:. -o cyclonedx-json=sbom.cdx.json
          test -s sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  lockfile:
    name: Dependency lockfile drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
      - name: Verify go.mod/go.sum are tidy
        working-directory: platform_live_go
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          diff -u /tmp/go.mod.before go.mod
          diff -u /tmp/go.sum.before go.sum

      - name: Verify Gradle lockfiles are current (S4-23)
        run: |
          ./gradlew --no-daemon :app:dependencies --write-locks \
            --configuration releaseRuntimeClasspath >/dev/null
          git diff --exit-code -- 'app/gradle.lockfile' 'settings-gradle.lockfile'
