name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库、也不应每次编译：
      # ① 按 Go 源码内容哈希走 actions/cache，源码没变直接命中；
      # ② 未命中则从最近的 release 资产下载（Publish 步骤会把 AAR 随 release 归档）；
      # ③ 都没有才由 Build 的 bindPlatformLive 现场生成（gomobile bind，需 Go+NDK）。
      - name: Restore platformlive AAR cache
        id: cache-aar
        uses: actions/cache@v4
        with:
          path: app/libs/platformlive.aar
          key: platformlive-aar-${{ hashFiles('platform_live_go/**', 'tools/bind-platform-live.sh') }}

      - name: Download platformlive AAR from latest release
        if: steps.cache-aar.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          AAR_URL=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq '[.[] | .assets[]? | select(.name=="platformlive.aar") | .browser_download_url] | first // empty' 2>/dev/null || true)
          if [ -n "$AAR_URL" ]; then
            curl -fL -o app/libs/platformlive.aar "$AAR_URL" || true
          fi
          # 校验下载产物：历史上存在 0 字节的坏资产，坏文件会让 AarTransform 报 "entry" 且不可恢复，
          # 必须删掉回落到 gomobile bind。要求：≥1MB 且以 PK zip 魔数开头。
          if [ -f app/libs/platformlive.aar ]; then
            SZ=$(stat -c%s app/libs/platformlive.aar)
            MAGIC=$(head -c2 app/libs/platformlive.aar)
            if [ "$SZ" -lt 1048576 ] || [ "$MAGIC" != "PK" ]; then
              echo "::warning::下载的 platformlive.aar 无效（size=$SZ magic=$MAGIC），删除并回落到现场生成"
              rm -f app/libs/platformlive.aar
            fi
          fi
          [ -f app/libs/platformlive.aar ] || echo "::notice::platformlive.aar 无缓存/无有效 release 资产，gomobile bind 现场生成"

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          # AAR 缺失时由 preBuild 依赖的 bindPlatformLive 现场生成（需要 Go + NDK，见上一步 setup-go）。
          if [ -f app/libs/platformlive.aar ]; then
            echo "Using existing platformlive.aar"
          else
            echo "platformlive.aar missing, gomobile bind will generate it"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Stage release artifacts
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_NAME="tvbox-v${VERSION_NAME}.apk"
          mkdir -p dist
          mv app/build/outputs/apk/release/${APK_NAME} dist/${APK_NAME}
          # 只保留带版本号的 APK，删除任何无版本号的构建产物。
          rm -f app/build/outputs/apk/release/app-release.apk
          # AAR 随 release 归档，供后续版本下载复用（避免每次都跑 gomobile bind）。
          cp app/libs/platformlive.aar dist/platformlive.aar || true
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/${APK_NAME} 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: APK size check
        run: |
          SIZE=$(stat -c%s dist/${APK_NAME})
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "APK size: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -gt 26214400 ]; then
            echo "::warning::APK 体积超过 25MB（当前 ${SIZE_MB}MB），请检查是否有意外的体积增长"
          fi

      - name: Compute and commit update.json
        run: |
          APK_PATH="dist/${APK_NAME}"
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cat > update.json <<ENDJSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/${APK_NAME}",
            "apkSha256": "$SHA256",
            "apkSize": $SIZE,
            "force": false,
            "changelog": []
          }
          ENDJSON
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # tag 触发时是 detached HEAD：先落到最新 main 再提交，push 显式指向 main。
          cp update.json /tmp/update.json
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore: auto-update update.json for v${VERSION_NAME}"
          git push origin HEAD:main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: TVBox ${{ github.ref_name }}
          body: |
            TVBox 手机/电视合集版 ${{ github.ref_name }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
