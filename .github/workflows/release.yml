name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库，从上一版本 release 下载
      - name: Download platformlive AAR from previous release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "Current: $CURRENT_TAG, Previous: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            AAR_URL=$(gh api "repos/${{ github.repository }}/releases/tags/$PREV_TAG" \
              --jq '.assets[] | select(.name=="platformlive.aar") | .browser_download_url' 2>/dev/null)
            if [ -n "$AAR_URL" ]; then
              mkdir -p app/libs
              curl -L -o app/libs/platformlive.aar "$AAR_URL"
              echo "Downloaded platformlive.aar from $PREV_TAG"
            else
              echo "WARNING: platformlive.aar not found in $PREV_TAG"
            fi
          fi
          if [ ! -f app/libs/platformlive.aar ]; then
            echo "::warning::platformlive.aar not found, will skip gomobile bind"
          fi

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f app/libs/platformlive.aar ]; then
            echo "Using existing platformlive.aar"
            ./gradlew --no-daemon assembleRelease
          else
            echo "No platformlive.aar, skipping gomobile bind"
            ./gradlew --no-daemon assembleRelease -PtvboxSkipPlatformBind=true
          fi

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk

      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/app-release.apk 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: Upload platformlive AAR to this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f app/libs/platformlive.aar ]; then
            gh release upload "${{ github.ref_name }}" app/libs/platformlive.aar \
              --repo "${{ github.repository }}" --clobber
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: TVBox ${{ github.ref_name }}
          body: |
            TVBox 手机/电视合集版 ${{ github.ref_name }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
