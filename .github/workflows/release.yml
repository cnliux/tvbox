name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要构建并发布的已有 tag（例如 v1.0.27）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # S4-20：发版是握有签名私钥的高权限流程，挂环境保护（需在仓库 Settings → Environments
    # 配置 required reviewers）。未配置时 GitHub 会按名称自动创建空环境，不阻断首次发版。
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      # S4-20：任何人 push v* tag 都会触发发布流水线。限制触发者必须是维护者，
      # 防止 tag 名字抢注（fork PR 拿不到 secrets ✅，但 tag 抢注能触发真实发布）。
      - name: Guard release actor
        env:
          RELEASE_ACTOR: ${{ github.event.sender.login }}
        run: |
          if [ "$RELEASE_ACTOR" != "cnliux" ]; then
            echo "::error::只有维护者 cnliux 可以触发 Release（当前触发者：$RELEASE_ACTOR）"
            exit 1
          fi

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-tags: true
          fetch-depth: 0

      # 版本号以 app/build.gradle.kts 为唯一来源；这里先校验 tag、README、CHANGELOG 三方一致。
      # README 第 7 行"当前版本 \`x.y.z\`"、CHANGELOG 顶部第一个 "## vX.Y.Z" 均需与 tag 对齐，
      # 发版前忘记改 README / CHANGELOG 是常见遗漏，此处提前拦截。
      # update.json 在 APK 构建并生成新 SHA256 / size 之后才校验 versionName，见下方 Update update.json 步骤。
      - name: Verify version consistency
        run: |
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'TVBOX_VERSION_CODE\s*=\s*\K\d+' app/build.gradle.kts)
          if [ "$RELEASE_TAG" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag ${RELEASE_TAG} 与 app 版本 v${VERSION_NAME} 不一致"
            exit 1
          fi
          # README：第 7 行形如"当前版本 `1.0.40`"或"当前为 `1.0.43`"，提取反引号内的版本号。
          # README 已改为「以 build.gradle.kts 为唯一来源、不在此处写死」，故同时兼容两种表述。
          README_VERSION=$(grep -oP '(当前版本|当前为) `\K[^`]+(?=`)' README.md | head -1 || true)
          if [ -z "$README_VERSION" ]; then
            echo "::error::README.md 未找到形如 '当前版本 \`x.y.z\`' 的版本行，无法校验版本一致性"
            exit 1
          fi
          if [ "$README_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::README.md 版本 ${README_VERSION} 与 app 版本 ${VERSION_NAME} 不一致，请同步更新 README.md"
            exit 1
          fi
          # CHANGELOG：取顶部第一个 "## vX.Y.Z" 或 "## X.Y.Z" 的版本号。
          CHANGELOG_VERSION=$(grep -oPm1 '^## v?\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::CHANGELOG.md 顶部未找到形如 '## vX.Y.Z' 的版本标题，无法校验版本一致性"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::CHANGELOG.md 顶部版本 v${CHANGELOG_VERSION} 与 app 版本 v${VERSION_NAME} 不一致，请补充本次发版条目"
            exit 1
          fi
          echo "Verified release version: v${VERSION_NAME} (${VERSION_CODE})"
          echo "README=${README_VERSION}, CHANGELOG=${CHANGELOG_VERSION} 与 tag 一致"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库，作为 Go 源码的构建产物内置到 APK：
      # ① 按 Go 源码内容哈希走 actions/cache，同 ref 内重跑（re-run）可直接命中；
      # ② 未命中则由 Build 的 bindPlatformLive 现场生成（gomobile bind，需 Go+NDK）。
      # 注意：GitHub 缓存按 ref 隔离，tag 之间不共享，因此正常发版每次都会执行一次 bind
      # （约 1-2 分钟），这是预期行为，不是缓存故障。
      # AAR 只通过 implementation(files(...)) 打进 APK，不再作为 release 资产分发。
      - name: Restore platformlive AAR cache
        id: cache-aar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/libs/platformlive.aar
            app/libs/platformlive.fingerprint
          key: platformlive-aar-${{ hashFiles('platform_live_go/**', 'tools/bind-platform-live.sh') }}

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          # AAR 缺失时由 preBuild 依赖的 bindPlatformLive 现场生成（需要 Go + NDK，见上一步 setup-go）。
          if [ -f app/libs/platformlive.aar ]; then
            echo "Using existing platformlive.aar"
          else
            echo "platformlive.aar missing, gomobile bind will generate it"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Stage release artifacts
        run: |
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_NAME="juhe-video-v${VERSION_NAME}.apk"
          mkdir -p dist
          mv app/build/outputs/apk/release/${APK_NAME} dist/${APK_NAME}
          # 只保留带版本号的 APK，删除任何无版本号的构建产物。
          rm -f app/build/outputs/apk/release/app-release.apk
          # platformlive.aar 已由 implementation(files(...)) 打进 APK，不再作为独立发布资产。
          # 若历史构建残留了同名文件，一并清掉，避免再次被 dist/* 上传。
          rm -f dist/platformlive.aar
          ls -la dist
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      # 发布硬闸：没有 release keystore 或 APK 实际未签名时立刻终止，绝不允许未签名包上传。
      - name: Verify release APK signature
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
          TVBOX_RELEASE_CERT_SHA256: ${{ secrets.TVBOX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${TVBOX_RELEASE_STORE_FILE_B64}" ]; then
            echo "::error::缺少 TVBOX_RELEASE_STORE_FILE_B64，终止发布"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，终止发布"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/${APK_NAME}"
          if [ -n "${TVBOX_RELEASE_CERT_SHA256:-}" ]; then
            "$APKSIGNER" verify --print-certs "dist/${APK_NAME}" \
              | grep -iq "${TVBOX_RELEASE_CERT_SHA256}" || {
                echo "::error::APK 签名证书指纹与基线不一致，终止发布"
                exit 1
              }
          fi

      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/${APK_NAME} 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      # P2-19：gomobile JNI 边界不被 R8 fullMode 裁掉。gomobile bind 产出的
      # 动态库固定命名为 libgojni.so（与 Go 模块名无关），其 JNI 入口以
      # Java_platformlive_* 导出符号暴露；该符号若被 R8/剥离裁掉，起播平台
      # 直播将抛 UnsatisfiedLinkError。用 strings 提取导出符号名校验。
      # 注意：gomobile 库并不导出 JNI_OnLoad，故以 Java_platformlive_ 为边界标志。
      - name: Verify gomobile JNI preserved
        run: |
          mkdir -p /tmp/jni_check
          cd /tmp/jni_check
          unzip -o "${GITHUB_WORKSPACE}/dist/${APK_NAME}" 'lib/arm64-v8a/*gojni*.so' >/dev/null 2>&1 || {
            echo "::error::APK 内未找到 libgojni.so（gomobile JNI 动态库）"
            exit 1
          }
          SO=$(find . -name '*gojni*.so' | head -1)
          if [ -z "$SO" ]; then
            echo "::error::APK 内未找到 libgojni.so（gomobile JNI 动态库）"
            exit 1
          fi
          echo "检查 $SO 的 JNI 边界符号…"
          if strings "$SO" | grep -q "Java_platformlive_"; then
            echo "Java_platformlive_* JNI 入口已保留（未被 R8 剥离）"
          else
            echo "::error::libgojni.so 缺少 Java_platformlive_* JNI 入口，R8 fullMode 可能裁掉了 gomobile JNI 边界"
            exit 1
          fi

      - name: APK size check
        run: |
          SIZE=$(stat -c%s dist/${APK_NAME})
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "APK size: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -gt 26214400 ]; then
            echo "::warning::APK 体积超过 25MB（当前 ${SIZE_MB}MB），请检查是否有意外的体积增长"
          fi

      - name: Compute and commit update.json
        run: |
          APK_PATH="dist/${APK_NAME}"
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_CODE=$(grep -oP 'TVBOX_VERSION_CODE\s*=\s*\K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/${APK_NAME}"
          # S7-40：从 CHANGELOG 顶部版本段的「你会感觉到」抽 3 行，写进 OTA 弹窗。
          # 抽不到就留空数组（老客户端 ignoreUnknownKeys 忽略），不阻断发版。
          HIGHLIGHTS=$(python3 - "$VERSION_NAME" <<'PYEOF'
          import json, re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## v?{re.escape(version)}\b.*?(?=^## v?\d|\Z)", text, re.S | re.M)
          lines = []
          if m:
              block = m.group(0)
              h = re.search(r"\*\*你会感觉到\*\*\s*：(.*?)(?=\*\*修了什么\*\*|\Z)", block, re.S)
              if h:
                  lines = [re.sub(r"^-\s*", "", x.strip()) for x in h.group(1).splitlines() if x.strip().startswith("-")]
          print(json.dumps(lines[:3], ensure_ascii=False))
          PYEOF
          )
          # P2-17：apkSha256 为空（构建异常）时禁止发布，杜绝「有 URL 无校验和」的条目被 OTA 拿到。
          if [ -z "$SHA256" ] || [ -z "$SIZE" ]; then
            echo "::error::apkSha256 或 apkSize 为空（SHA256=${SHA256} SIZE=${SIZE}），禁止发布 update.json"
            exit 1
          fi
           # T7-44：update.json 新增 schema/minReader/createdBy 信封；老客户端 ignoreUnknownKeys=true 忽略，新客户端走统一 schema 路径。
           # P2-17：原子写（临时文件 + rename），避免 apkSha256 与 apkUrl 分两次写的窗口被 OTA 读到。
          cat > update.json.tmp <<ENDJSON
           {
             "schema": 1,
             "kind": "update_manifest",
             "minReader": 1,
             "createdBy": "$VERSION_NAME/$VERSION_CODE",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "$APK_URL",
            "apkSha256": "$SHA256",
            "apkSize": $SIZE,
            "force": false,
            "changelog": [],
            "release_highlights": $HIGHLIGHTS,
            "apkMirrors": [
              "https://gh-proxy.org/$APK_URL",
              "https://gh-proxy.com/$APK_URL"
            ]
          }
          ENDJSON
          mv -f update.json.tmp update.json
          # P08 补充：update.json 已写入新版本，回读 versionName 做四方对齐的最后一步。
          # 若 update.json 仍是上一版本，说明本次发版流程有遗漏，此处直接报错。
          UPDATE_JSON_VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['versionName'])")
          if [ "$UPDATE_JSON_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::update.json versionName (${UPDATE_JSON_VERSION}) 与 app 版本 (${VERSION_NAME}) 不一致"
            exit 1
          fi
          echo "update.json versionName=${UPDATE_JSON_VERSION} 与 tag 一致"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # tag 触发时是 detached HEAD：先落到最新 main 再提交，push 显式指向 main。
          cp update.json /tmp/update.json
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore: auto-update update.json for v${VERSION_NAME}"
          git push origin HEAD:main

      # P09：在发布前扫描 dist/ 下所有 APK，生成 manifest.json（含 sha256 / 字节数），
      # 供 CDN、爬虫和用户校验本次 Release 的资产完整性。
      - name: Generate release manifest
        run: |
          set -e
          mkdir -p dist
          # 收集本次要上传的 APK 文件（不含 manifest.json 自身），文件名排序保证输出稳定。
          mapfile -t APK_FILES < <(find dist -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::dist/ 下未找到任何 .apk 文件，无法生成 manifest"
            exit 1
          fi
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 用 Python 生成 JSON，避免手写拼接出错；sha256 与 size 通过环境变量传入。
          python3 - "${RELEASE_TAG}" "${GENERATED_AT}" "${APK_FILES[@]}" <<'PYEOF'
          import hashlib
          import json
          import os
          import sys

          release_tag = sys.argv[1]
          generated_at = sys.argv[2]
          apk_names = sys.argv[3:]

          assets = []
          for name in apk_names:
              path = os.path.join("dist", name)
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              assets.append({
                  "name": name,
                  "sha256": h.hexdigest(),
                  "size": os.path.getsize(path),
              })

          manifest = {
              "releaseTag": release_tag,
              "generatedAt": generated_at,
              "assets": assets,
          }
          out = os.path.join("dist", "manifest.json")
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"manifest written: {out} ({len(assets)} asset(s))")
          PYEOF
          cat dist/manifest.json

      # S4-20：侧载分发没有签名 = 用户只能「信我」；加签名后用户才能「验我」。
      # 公钥需随 README / 端内 OTA 校验发布（与 S1-02 的证书钉扎共用信任根）。
      # 未配置 COSIGN_PRIVATE_KEY 时跳过，不阻断既有发布流程；配置后每个 APK 产出 .sig 供校验。
      # S1-04：BuildConfig.AI_API_KEY 若非空会明文进 dex，发布前直接 fail。
      - name: No plaintext API key in dex
        run: python3 tools/check_no_secret_in_dex.py --apk dist/*.apk

      - name: Sign release APKs with cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -e
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::notice::COSIGN_PRIVATE_KEY 未配置，跳过二进制签名（密钥生成/公钥发布见 README）"
            exit 0
          fi
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /tmp/cosign
          chmod +x /tmp/cosign
          for apk in dist/*.apk; do
            /tmp/cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY "$apk" --output-signature "${apk}.sig"
          done
          echo "cosign signatures written: $(find dist -name '*.sig' | wc -l)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: 聚合视频 ${{ env.RELEASE_TAG }}
          body: |
            聚合视频 手机/电视合集版 ${{ env.RELEASE_TAG }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true

      # S7-39：发布后跑一遍 8 项断言（资产/sha/版本/ABI/密钥/SBOM/半截上传物）。
      # 任一失败 → 给 Release 打 verification-failed label 并开 issue，而不是等用户来问。
      - name: Post-release verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/release_verify.py --tag "$RELEASE_TAG" --allow-missing-sbom
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --add-label verification-failed || true
            BODY=$(printf '发布后校验未通过，请检查 Release 资产与 update.json 三方一致性。\n\n_run: %s_' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "发布校验失败：$RELEASE_TAG" --label verification-failed --body "$BODY" || true
            exit 1
          fi

      # T8-52：发版前跑一轮本地 checklist（README/CHANGELOG/OSS notice/lockfile/PENDING_ITEMS/schemas/audit）。
      # 任一失败 → 开 issue 并标 verification-failed；gh CLI 缺失只告警不阻断（CI 已有其余门禁）。
      - name: Pre-release checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/release_checklist.py --tag "$RELEASE_TAG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --add-label verification-failed || true
            BODY=$(printf '发布前 checklist 未通过，请人工核查：\n\n_run: %s_' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "发布 checklist 失败：$RELEASE_TAG" --label verification-failed --body "$BODY" || true
            exit 1
          fi
