name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），
      # 缺失的 platform/build-tools 由 AGP 自动下载，无需 setup-android。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库，从上一版本 release 下载；若无则用 -PtvboxSkipPlatformBind=true 跳过绑定。
      - name: Download platformlive AAR from previous release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ] && [ "$TAG" != "$(git rev-parse --short HEAD)" ]; then
            # 尝试从前一个 release 下载 AAR
            DOWNLOAD_URL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
              --jq '.assets[] | select(.name=="platformlive.aar") | .browser_download_url' 2>/dev/null)
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -L -o app/libs/platformlive.aar "$DOWNLOAD_URL"
              echo "Downloaded platformlive.aar from $TAG"
            fi
          fi
          # 如果 AAR 仍不存在，则跳过 gomobile bind 并提示用户手动添加
          if [ ! -f app/libs/platformlive.aar ]; then
            echo "WARNING: platformlive.aar not found, build with skip flag"
          fi

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f app/libs/platformlive.aar ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleRelease -PtvboxSkipPlatformBind=true
          fi

      # 单一合集版本：同一套代码运行时适配电视/手机；原生库只发布 arm64-v8a。
      # 只发布 APK，不再产出 AAB。
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk

      # 发布策略硬校验：Release 只允许 arm64-v8a，禁止 armv7/x86 混入。
      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/app-release.apk 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: TVBox ${{ github.ref_name }}
          body: |
            TVBox 手机/电视合集版 ${{ github.ref_name }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
