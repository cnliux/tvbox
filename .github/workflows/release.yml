name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要构建并发布的已有 tag（例如 v1.0.27）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-tags: true
          fetch-depth: 0

      # 版本号以 app/build.gradle.kts 为唯一来源；这里先校验 tag、README、CHANGELOG 三方一致。
      # README 第 7 行"当前版本 \`x.y.z\`"、CHANGELOG 顶部第一个 "## vX.Y.Z" 均需与 tag 对齐，
      # 发版前忘记改 README / CHANGELOG 是常见遗漏，此处提前拦截。
      # update.json 在 APK 构建并生成新 SHA256 / size 之后才校验 versionName，见下方 Update update.json 步骤。
      - name: Verify version consistency
        run: |
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'TVBOX_VERSION_CODE\s*=\s*\K\d+' app/build.gradle.kts)
          if [ "$RELEASE_TAG" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag ${RELEASE_TAG} 与 app 版本 v${VERSION_NAME} 不一致"
            exit 1
          fi
          # README：第 7 行形如"当前版本 `1.0.40`"，提取反引号内的版本号。
          README_VERSION=$(grep -oP '当前版本 `\K[^`]+(?=`)' README.md || true)
          if [ -z "$README_VERSION" ]; then
            echo "::error::README.md 未找到形如 '当前版本 \`x.y.z\`' 的版本行，无法校验版本一致性"
            exit 1
          fi
          if [ "$README_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::README.md 版本 ${README_VERSION} 与 app 版本 ${VERSION_NAME} 不一致，请同步更新 README.md"
            exit 1
          fi
          # CHANGELOG：取顶部第一个 "## vX.Y.Z" 或 "## X.Y.Z" 的版本号。
          CHANGELOG_VERSION=$(grep -oPm1 '^## v?\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::CHANGELOG.md 顶部未找到形如 '## vX.Y.Z' 的版本标题，无法校验版本一致性"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::CHANGELOG.md 顶部版本 v${CHANGELOG_VERSION} 与 app 版本 v${VERSION_NAME} 不一致，请补充本次发版条目"
            exit 1
          fi
          echo "Verified release version: v${VERSION_NAME} (${VERSION_CODE})"
          echo "README=${README_VERSION}, CHANGELOG=${CHANGELOG_VERSION} 与 tag 一致"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库，作为 Go 源码的构建产物内置到 APK：
      # ① 按 Go 源码内容哈希走 actions/cache，同 ref 内重跑（re-run）可直接命中；
      # ② 未命中则由 Build 的 bindPlatformLive 现场生成（gomobile bind，需 Go+NDK）。
      # 注意：GitHub 缓存按 ref 隔离，tag 之间不共享，因此正常发版每次都会执行一次 bind
      # （约 1-2 分钟），这是预期行为，不是缓存故障。
      # AAR 只通过 implementation(files(...)) 打进 APK，不再作为 release 资产分发。
      - name: Restore platformlive AAR cache
        id: cache-aar
        uses: actions/cache@v4
        with:
          path: |
            app/libs/platformlive.aar
            app/libs/platformlive.fingerprint
          key: platformlive-aar-${{ hashFiles('platform_live_go/**', 'tools/bind-platform-live.sh') }}

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          # AAR 缺失时由 preBuild 依赖的 bindPlatformLive 现场生成（需要 Go + NDK，见上一步 setup-go）。
          if [ -f app/libs/platformlive.aar ]; then
            echo "Using existing platformlive.aar"
          else
            echo "platformlive.aar missing, gomobile bind will generate it"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Stage release artifacts
        run: |
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_NAME="juhe-video-v${VERSION_NAME}.apk"
          mkdir -p dist
          mv app/build/outputs/apk/release/${APK_NAME} dist/${APK_NAME}
          # 只保留带版本号的 APK，删除任何无版本号的构建产物。
          rm -f app/build/outputs/apk/release/app-release.apk
          # platformlive.aar 已由 implementation(files(...)) 打进 APK，不再作为独立发布资产。
          # 若历史构建残留了同名文件，一并清掉，避免再次被 dist/* 上传。
          rm -f dist/platformlive.aar
          ls -la dist
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/${APK_NAME} 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: APK size check
        run: |
          SIZE=$(stat -c%s dist/${APK_NAME})
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "APK size: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -gt 26214400 ]; then
            echo "::warning::APK 体积超过 25MB（当前 ${SIZE_MB}MB），请检查是否有意外的体积增长"
          fi

      - name: Compute and commit update.json
        run: |
          APK_PATH="dist/${APK_NAME}"
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_CODE=$(grep -oP 'TVBOX_VERSION_CODE\s*=\s*\K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/${APK_NAME}"
          # update.json 既有 8 个字段结构不变；apkMirrors 是可选的多 CDN 镜像列表，
          # 老客户端 ignoreUnknownKeys 会忽略它，新客户端优先于内置派生 CDN 使用。
          cat > update.json <<ENDJSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "$APK_URL",
            "apkSha256": "$SHA256",
            "apkSize": $SIZE,
            "force": false,
            "changelog": [],
            "apkMirrors": [
              "https://gh-proxy.org/$APK_URL",
              "https://gh-proxy.com/$APK_URL",
              "https://ghproxy.net/$APK_URL"
            ]
          }
          ENDJSON
          # P08 补充：update.json 已写入新版本，回读 versionName 做四方对齐的最后一步。
          # 若 update.json 仍是上一版本，说明本次发版流程有遗漏，此处直接报错。
          UPDATE_JSON_VERSION=$(python3 -c "import json;print(json.load(open('update.json'))['versionName'])")
          if [ "$UPDATE_JSON_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::update.json versionName (${UPDATE_JSON_VERSION}) 与 app 版本 (${VERSION_NAME}) 不一致"
            exit 1
          fi
          echo "update.json versionName=${UPDATE_JSON_VERSION} 与 tag 一致"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # tag 触发时是 detached HEAD：先落到最新 main 再提交，push 显式指向 main。
          cp update.json /tmp/update.json
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore: auto-update update.json for v${VERSION_NAME}"
          git push origin HEAD:main

      # P09：在发布前扫描 dist/ 下所有 APK，生成 manifest.json（含 sha256 / 字节数），
      # 供 CDN、爬虫和用户校验本次 Release 的资产完整性。
      - name: Generate release manifest
        run: |
          set -e
          mkdir -p dist
          # 收集本次要上传的 APK 文件（不含 manifest.json 自身），文件名排序保证输出稳定。
          mapfile -t APK_FILES < <(find dist -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::dist/ 下未找到任何 .apk 文件，无法生成 manifest"
            exit 1
          fi
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 用 Python 生成 JSON，避免手写拼接出错；sha256 与 size 通过环境变量传入。
          python3 - "${RELEASE_TAG}" "${GENERATED_AT}" "${APK_FILES[@]}" <<'PYEOF'
          import hashlib
          import json
          import os
          import sys

          release_tag = sys.argv[1]
          generated_at = sys.argv[2]
          apk_names = sys.argv[3:]

          assets = []
          for name in apk_names:
              path = os.path.join("dist", name)
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              assets.append({
                  "name": name,
                  "sha256": h.hexdigest(),
                  "size": os.path.getsize(path),
              })

          manifest = {
              "releaseTag": release_tag,
              "generatedAt": generated_at,
              "assets": assets,
          }
          out = os.path.join("dist", "manifest.json")
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(f"manifest written: {out} ({len(assets)} asset(s))")
          PYEOF
          cat dist/manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          name: 聚合视频 ${{ env.RELEASE_TAG }}
          body: |
            聚合视频 手机/电视合集版 ${{ env.RELEASE_TAG }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
