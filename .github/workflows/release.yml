name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 平台直播解析为 Go 实现（platform_live_go），以 gomobile bind 产出 AAR。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      # gomobile 经 ANDROID_NDK_HOME 定位 NDK。
      - name: Point gomobile at NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | sort -V | tail -n 1)" >> "$GITHUB_ENV"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），
      # 缺失的 platform/build-tools 由 AGP 自动下载，无需 setup-android。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK + AAB
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # 单一合集版本：同一套代码运行时适配电视/手机；原生库只发布 arm64-v8a。
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab

      # 发布策略硬校验：Release 只允许 arm64-v8a，禁止 armv7/x86 混入。
      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/app-release.apk 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: TVBox ${{ github.ref_name }}
          body: |
            TVBox 手机/电视合集版 ${{ github.ref_name }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
