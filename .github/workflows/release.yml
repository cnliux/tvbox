name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          TVBOX_RELEASE_STORE_FILE_B64: ${{ secrets.TVBOX_RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -n "$TVBOX_RELEASE_STORE_FILE_B64" ]; then
            echo "$TVBOX_RELEASE_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/tvbox-release.jks"
            echo "TVBOX_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/tvbox-release.jks" >> "$GITHUB_ENV"
          fi

      # platformlive.aar 不入库，作为 Go 源码的构建产物内置到 APK：
      # ① 按 Go 源码内容哈希走 actions/cache，同 ref 内重跑（re-run）可直接命中；
      # ② 未命中则由 Build 的 bindPlatformLive 现场生成（gomobile bind，需 Go+NDK）。
      # 注意：GitHub 缓存按 ref 隔离，tag 之间不共享，因此正常发版每次都会执行一次 bind
      # （约 1-2 分钟），这是预期行为，不是缓存故障。
      # AAR 只通过 implementation(files(...)) 打进 APK，不再作为 release 资产分发。
      - name: Restore platformlive AAR cache
        id: cache-aar
        uses: actions/cache@v4
        with:
          path: app/libs/platformlive.aar
          key: platformlive-aar-${{ hashFiles('platform_live_go/**', 'tools/bind-platform-live.sh') }}

      - name: Build release APK
        env:
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_RELEASE_STORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: ${{ secrets.TVBOX_RELEASE_KEY_ALIAS }}
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_RELEASE_KEY_PASSWORD }}
        run: |
          # AAR 缺失时由 preBuild 依赖的 bindPlatformLive 现场生成（需要 Go + NDK，见上一步 setup-go）。
          if [ -f app/libs/platformlive.aar ]; then
            echo "Using existing platformlive.aar"
          else
            echo "platformlive.aar missing, gomobile bind will generate it"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Stage release artifacts
        run: |
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_NAME="tvbox-v${VERSION_NAME}.apk"
          mkdir -p dist
          mv app/build/outputs/apk/release/${APK_NAME} dist/${APK_NAME}
          # 只保留带版本号的 APK，删除任何无版本号的构建产物。
          rm -f app/build/outputs/apk/release/app-release.apk
          # platformlive.aar 已由 implementation(files(...)) 打进 APK，不再作为独立发布资产。
          # 若历史构建残留了同名文件，一并清掉，避免再次被 dist/* 上传。
          rm -f dist/platformlive.aar
          ls -la dist
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Verify arm64-v8a only
        run: |
          ABIS=$(unzip -Z1 dist/${APK_NAME} 'lib/*' | cut -d/ -f2 | sort -u)
          echo "APK ABIs: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release 只允许 arm64-v8a，实际为: $ABIS"
            exit 1
          fi

      - name: APK size check
        run: |
          SIZE=$(stat -c%s dist/${APK_NAME})
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "APK size: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -gt 26214400 ]; then
            echo "::warning::APK 体积超过 25MB（当前 ${SIZE_MB}MB），请检查是否有意外的体积增长"
          fi

      - name: Compute and commit update.json
        run: |
          APK_PATH="dist/${APK_NAME}"
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_PATH")
          VERSION_CODE=$(grep -oP 'TVBOX_VERSION_CODE\s*=\s*\K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'TVBOX_VERSION_NAME\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cat > update.json <<ENDJSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/${APK_NAME}",
            "apkSha256": "$SHA256",
            "apkSize": $SIZE,
            "force": false,
            "changelog": []
          }
          ENDJSON
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # tag 触发时是 detached HEAD：先落到最新 main 再提交，push 显式指向 main。
          cp update.json /tmp/update.json
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore: auto-update update.json for v${VERSION_NAME}"
          git push origin HEAD:main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: TVBox ${{ github.ref_name }}
          body: |
            TVBox 手机/电视合集版 ${{ github.ref_name }}。

            - 不内置任何点播视频接口与电视直播源，视频源与直播源均需自行导入
            - 平台直播站点（斗鱼/虎牙等）可管控
            - APK 已使用 release keystore 签名
          generate_release_notes: true
