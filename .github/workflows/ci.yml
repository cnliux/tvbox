name: CI

# 日常质量门禁：push/PR 只做编译、单测、lint，不构建/上传 APK。
# 发布构建由 release.yml（tag / 手动触发）负责，两者互不重复。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交会取消上一次未完成的 CI，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # platformlive.aar 不入库，编译前需要 gomobile bind 产物；
      # 与 release.yml 共用同一份源码哈希缓存，避免重复编译 Go。
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # P41：AAR 由 Go 源码编译，CI 必须跑 Go 测试与静态检查，
      # 否则 Go 侧改动（包括 cmd 服务）可以绕过所有门禁。
      - name: Go quality (test + vet)
        working-directory: platform_live_go
        run: |
          go vet ./...
          go test -shuffle=on -count=1 ./...

      - name: Restore platformlive AAR cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/libs/platformlive.aar
            app/libs/platformlive.fingerprint
          key: platformlive-aar-${{ hashFiles('platform_live_go/**', 'tools/bind-platform-live.sh') }}

      - name: Compile Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Linux 单测失败时，Windows 本地往往全绿（平台/时序相关 flaky）。
      # 这里把失败测试的类名+方法+断言摘要直接打到 Step Summary，
      # 无需下载 artifact 即可定位具体是哪条 @Test 挂了。
      - name: Diagnose failed tests
        if: failure()
        run: |
          echo "### 失败的单元测试" >> "$GITHUB_STEP_SUMMARY"
          DIR=app/build/test-results/testDebugUnitTest
          if [ -d "$DIR" ]; then
            found=0
            for xml in $(find "$DIR" -name '*.xml'); do
              # 仅处理含 <failure> 的报告
              if grep -q "<failure" "$xml"; then
                found=1
                cls=$(grep -oPm1 'testsuite name="\K[^"]+' "$xml")
                echo "- **$cls**" >> "$GITHUB_STEP_SUMMARY"
                grep -oPm3 '<testcase name="\K[^"]+(?=".*>\s*<failure)' "$xml" 2>/dev/null | head -5 >> "$GITHUB_STEP_SUMMARY" || true
                # 失败消息首行
                grep -oPm3 '<failure[^>]*message="\K[^"]{0,300}' "$xml" 2>/dev/null | head -5 >> "$GITHUB_STEP_SUMMARY" || true
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            [ "$found" = "0" ] && echo "（未找到含 <failure> 的报告，可能是构建失败而非断言失败）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "（未找到 $DIR，测试任务可能未产出报告）" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 同时把原始报告也保留到日志，便于 grep
          find app/build/test-results -name '*.xml' 2>/dev/null | head -5
          grep -rl "<failure" app/build/test-results 2>/dev/null || echo "no-failure-xml"

      - name: OSS notices sync (S2-08)
        run: python3 tools/gen_oss_notices.py --check --root .

      - name: NSC / builtin domain sync (S1-02)
        run: python3 tools/gen_nsc.py --check --root .

      - name: No plaintext API key in sources (S1-04)
        run: python3 tools/check_no_secret_in_dex.py --self-test

      - name: Action pin gate (S4-20)
        run: python3 tools/check_action_pins.py --root .

      - name: Pending items / TODO lint (S8-44)
        run: python3 tools/pending_todo_lint.py --root .

      - name: No new direct Log calls (S1-07)
        run: python3 tools/check_direct_log.py --root .

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
