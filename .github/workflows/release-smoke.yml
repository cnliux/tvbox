name: Release smoke

# T4-26：把「Debug 好好的，Release 就废」这一类事故挡在合 main 之前。
# 不依赖真机：编译 Release APK 后跑 tools/verify_release_smoke.sh 五道闸。
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform_live_go/go.mod
          cache-dependency-path: platform_live_go/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Assemble release (unsigned debug-key build is fine for smoke)
        # 冒烟只关心 dex / 资源 / manifest，不需要发布签名；-PtvboxCi=true 与 release.yml 一致。
        run: ./gradlew --no-daemon assembleRelease -PtvboxCi=true --console=plain

      - name: Run five release smoke gates
        run: bash tools/verify_release_smoke.sh
